<svg xmlns="http://www.w3.org/2000/svg" width="720" height="830" viewBox="0 0 720 830" font-family="Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="720" height="830" fill="#ffffff"/>
<text x="30" y="32" font-size="19" font-weight="700" fill="#1b1b1b">Kiosk Door — Front Layout (24" panel)</text>
<text x="30" y="51" font-size="12.5" fill="#555">Scale 20 px = 1 in. Geometry derived from a 24" 16:9 panel run portrait.</text>
<rect x="440" y="18" width="252" height="20" fill="#FBE7E1" stroke="#B3401A" stroke-width="1"/>
<text x="450" y="32" font-size="11.5" font-weight="700" fill="#B3401A">DERIVED — CONFIRM AGAINST REAL PANEL</text>

<!-- door face -->
<rect x="220" y="110" width="290" height="600" rx="4" fill="#E5DDCB" stroke="#2b2b2b" stroke-width="2"/>
<!-- badge -->
<rect x="232" y="118" width="96" height="24" fill="#1b1b1b"/>
<text x="280" y="135" font-size="11" fill="#f0ebe0" text-anchor="middle" letter-spacing="1.5">CONCURRENT</text>
<!-- black screen bezel -->
<rect x="237" y="150" width="256" height="438" fill="#141414"/>
<!-- active area -->
<rect x="247" y="160" width="236" height="418" fill="#E9E2D0"/>
<text x="365" y="352" font-size="14" fill="#4a4436" text-anchor="middle" font-weight="600">ACTIVE AREA</text>
<text x="365" y="374" font-size="12.5" fill="#7a7264" text-anchor="middle">11.8" x 20.9"</text>
<text x="365" y="392" font-size="11.5" fill="#7a7264" text-anchor="middle">1080 x 1920 portrait</text>
<!-- button plate -->
<rect x="237" y="600" width="256" height="80" fill="#1b1b1b"/>
<circle cx="301" cy="640" r="14" fill="#3d3d3d" stroke="#9a9a9a" stroke-width="1.5"/>
<circle cx="365" cy="640" r="14" fill="#3d3d3d" stroke="#9a9a9a" stroke-width="1.5"/>
<circle cx="429" cy="640" r="14" fill="#3d3d3d" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="301" y="645" font-size="15" fill="#eee" text-anchor="middle">&#8592;</text>
<text x="365" y="646" font-size="15" fill="#eee" text-anchor="middle">&#8962;</text>
<text x="429" y="645" font-size="15" fill="#eee" text-anchor="middle">&#8594;</text>
<text x="301" y="670" font-size="9.5" fill="#cfcfcf" text-anchor="middle" letter-spacing="1">BACK</text>
<text x="365" y="670" font-size="9.5" fill="#cfcfcf" text-anchor="middle" letter-spacing="1">HOME</text>
<text x="429" y="670" font-size="9.5" fill="#cfcfcf" text-anchor="middle" letter-spacing="1">NEXT</text>
<!-- spare button blanks -->
<circle cx="255" cy="640" r="7" fill="none" stroke="#6a6a6a" stroke-width="1" stroke-dasharray="3 2"/>
<circle cx="475" cy="640" r="7" fill="none" stroke="#6a6a6a" stroke-width="1" stroke-dasharray="3 2"/>
<!-- hinge -->
<rect x="210" y="140" width="10" height="540" fill="#9a9a9a" stroke="#444" stroke-width="1"/>
<text x="205" y="410" font-size="10.5" fill="#333" text-anchor="middle" transform="rotate(-90 205 410)">PIANO HINGE</text>

<!-- ===== DIMENSIONS ===== -->
<g stroke="#B3401A" stroke-width="1" fill="none">
<!-- overall width top -->
<line x1="220" y1="110" x2="220" y2="82"/><line x1="510" y1="110" x2="510" y2="82"/>
<line x1="220" y1="88" x2="510" y2="88"/><line x1="220" y1="83" x2="220" y2="93"/><line x1="510" y1="83" x2="510" y2="93"/>
<!-- bezel width -->
<line x1="237" y1="150" x2="237" y2="736"/><line x1="493" y1="150" x2="493" y2="736"/>
<line x1="237" y1="730" x2="493" y2="730"/><line x1="237" y1="725" x2="237" y2="735"/><line x1="493" y1="725" x2="493" y2="735"/>
<!-- active width -->
<line x1="247" y1="578" x2="247" y2="766"/><line x1="483" y1="578" x2="483" y2="766"/>
<line x1="247" y1="760" x2="483" y2="760"/><line x1="247" y1="755" x2="247" y2="765"/><line x1="483" y1="755" x2="483" y2="765"/>
<!-- button spacing -->
<line x1="301" y1="640" x2="301" y2="700"/><line x1="365" y1="640" x2="365" y2="700"/><line x1="429" y1="640" x2="429" y2="700"/>
<line x1="301" y1="696" x2="429" y2="696"/>
<line x1="301" y1="691" x2="301" y2="701"/><line x1="365" y1="691" x2="365" y2="701"/><line x1="429" y1="691" x2="429" y2="701"/>
<!-- right: overall height -->
<line x1="510" y1="110" x2="660" y2="110"/><line x1="510" y1="710" x2="660" y2="710"/>
<line x1="650" y1="110" x2="650" y2="710"/><line x1="645" y1="110" x2="655" y2="110"/><line x1="645" y1="710" x2="655" y2="710"/>
<!-- right: bezel height -->
<line x1="493" y1="150" x2="600" y2="150"/><line x1="493" y1="588" x2="600" y2="588"/>
<line x1="590" y1="150" x2="590" y2="588"/><line x1="585" y1="150" x2="595" y2="150"/><line x1="585" y1="588" x2="595" y2="588"/>
<!-- right: active height -->
<line x1="483" y1="160" x2="545" y2="160"/><line x1="483" y1="578" x2="545" y2="578"/>
<line x1="535" y1="160" x2="535" y2="578"/><line x1="530" y1="160" x2="540" y2="160"/><line x1="530" y1="578" x2="540" y2="578"/>
<!-- left stack: margins -->
<line x1="220" y1="110" x2="120" y2="110"/><line x1="220" y1="150" x2="120" y2="150"/>
<line x1="130" y1="110" x2="130" y2="150"/><line x1="125" y1="110" x2="135" y2="110"/><line x1="125" y1="150" x2="135" y2="150"/>
<line x1="220" y1="588" x2="120" y2="588"/><line x1="220" y1="600" x2="120" y2="600"/>
<line x1="130" y1="588" x2="130" y2="600"/><line x1="125" y1="588" x2="135" y2="588"/><line x1="125" y1="600" x2="135" y2="600"/>
<line x1="220" y1="680" x2="120" y2="680"/><line x1="220" y1="710" x2="120" y2="710"/>
<line x1="130" y1="600" x2="130" y2="680"/><line x1="125" y1="600" x2="135" y2="600"/><line x1="125" y1="680" x2="135" y2="680"/>
<line x1="130" y1="680" x2="130" y2="710"/><line x1="125" y1="710" x2="135" y2="710"/>
</g>
<g font-size="12" fill="#B3401A" font-weight="600">
<rect x="337" y="79" width="56" height="16" fill="#fff"/><text x="365" y="92" text-anchor="middle">14.5"</text>
<rect x="337" y="721" width="56" height="16" fill="#fff"/><text x="365" y="734" text-anchor="middle">12.8"</text>
<rect x="337" y="751" width="56" height="16" fill="#fff"/><text x="365" y="764" text-anchor="middle">11.8"</text>
<rect x="337" y="687" width="60" height="16" fill="#fff"/><text x="365" y="700" text-anchor="middle" font-size="11">3.2" c-c</text>
<text x="650" y="410" text-anchor="middle" transform="rotate(-90 650 410)">30.0"</text>
<text x="590" y="369" text-anchor="middle" transform="rotate(-90 590 369)">21.9"</text>
<text x="535" y="369" text-anchor="middle" transform="rotate(-90 535 369)">20.9"</text>
<text x="130" y="130" text-anchor="end" font-size="11">2.0"</text>
<text x="118" y="598" text-anchor="end" font-size="11">0.6"</text>
<text x="118" y="645" text-anchor="end" font-size="11">4.0"</text>
<text x="118" y="700" text-anchor="end" font-size="11">1.5"</text>
</g>

<!-- notes -->
<g font-size="11.5" fill="#333">
<text x="30" y="180" font-weight="700">STACK, TOP TO BOTTOM</text>
<text x="30" y="199">2.0"  badge band (CONCURRENT)</text>
<text x="30" y="216">21.9"  bezel + panel</text>
<text x="30" y="233">0.6"  reveal</text>
<text x="30" y="250">4.0"  button plate</text>
<text x="30" y="267">1.5"  bottom rail</text>
<text x="30" y="291" font-weight="700">SIDE MARGINS</text>
<text x="30" y="310">0.85" tan face each side</text>
<text x="30" y="327">0.50" black bezel reveal</text>
<text x="30" y="351" font-weight="700">BUTTONS</text>
<text x="30" y="370">30 mm arcade; 1.12"</text>
<text x="30" y="387">(28.5 mm) hole, 3.2" c-c.</text>
<text x="30" y="404">Dashed blanks = spare</text>
<text x="30" y="421">lines (ER3 / SW-C3).</text>
<text x="30" y="445" font-weight="700">WEIGHT BUDGET</text>
<text x="30" y="464">alu face + shroud  7.4 lb</text>
<text x="30" y="481">panel + board      4.5 lb</text>
<text x="30" y="498">Pi, buttons, fixings 2.5 lb</text>
<text x="30" y="515" font-weight="700">total  ~14.5 lb</text>
<text x="30" y="532">CG ~7" from hinge</text>
<text x="30" y="549">&#8776; 100 in-lb moment</text>
</g>
<text x="30" y="800" font-size="11.5" fill="#B3401A" font-weight="600">27" stretch option: active 13.2" x 23.5" &#8594; door grows to ~15.9" x 32.7". Only viable if the measured clear opening is &#8805; 21".</text>
<text x="30" y="818" font-size="11.5" fill="#444">Panel outline (glass + backlight frame) assumed 12.4" x 21.6" — must be measured off the actual salvaged panel before cutting anything.</text>
</svg>
