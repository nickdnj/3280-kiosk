<text x="40.0" y="974.0" font-size="11.5" fill="#2F5D3A" text-anchor="start" font-weight="600">Proud variant: delete the monitor window, keep the VESA holes — the monitor then bolts to the face and nothing precision needs cutting.</text>
<text x="40.0" y="992.0" font-size="11.5" fill="#B3401A" text-anchor="start" font-weight="600">Window is cut 0.30" inside the bezel outline so the monitor's own bezel overlaps the cut — far more forgiving than a bare panel.</text>
