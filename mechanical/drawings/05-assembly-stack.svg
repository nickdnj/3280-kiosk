<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" font-family="Helvetica,Arial,sans-serif"><rect width="1040" height="660" fill="#ffffff"/>
<text x="40.0" y="42.0" font-size="21" fill="#1b1b1b" text-anchor="start" font-weight="700">Assembly Stack — Carrier Panel + Cased Monitor</text>
<text x="40.0" y="64.0" font-size="12.5" fill="#555" text-anchor="start" font-weight="400">Front to back. 27" commercial monitor kept whole; no de-casing. Option C.</text>
<rect x="40" y="78" width="346" height="21" fill="#E4EFDF" stroke="#2F5D3A"/>
<text x="50.0" y="93.0" font-size="11.5" fill="#2F5D3A" text-anchor="start" font-weight="700">NO DE-CASING, NO PRECISION CUT, DOCENT-REPLACEABLE</text>
<rect x="80.0" y="150.0" width="150.0" height="300.0" fill="#E5DDCB" stroke="#2b2b2b" stroke-width="1.5"/>
<rect x="108.0" y="190.0" width="94.0" height="150.0" fill="#20211f" stroke="#B3401A" stroke-width="1.2"/>
<rect x="108.0" y="356.0" width="94.0" height="34.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<circle cx="125.0" cy="373.0" r="7.0" fill="#3d3d3d" stroke="#8d8d8d" stroke-width="0.8"/>
<circle cx="155.0" cy="373.0" r="7.0" fill="#3d3d3d" stroke="#8d8d8d" stroke-width="0.8"/>
<circle cx="185.0" cy="373.0" r="7.0" fill="#3d3d3d" stroke="#8d8d8d" stroke-width="0.8"/>
<rect x="120.0" y="404.0" width="70.0" height="40.0" fill="#20211f" stroke="#B3401A" stroke-width="1" stroke-dasharray="4 3" opacity="0.3"/>
<text x="155.0" y="486.0" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="700">CARRIER PANEL</text>
<text x="155.0" y="506.0" font-size="10.3" fill="#555" text-anchor="middle" font-weight="400">24.30" x 68.175"</text>
<text x="155.0" y="521.0" font-size="10.3" fill="#555" text-anchor="middle" font-weight="400">tan, replaces the outer door</text>
<text x="155.0" y="536.0" font-size="10.3" fill="#555" text-anchor="middle" font-weight="400">window + VESA + button holes</text>
<line x1="245.0" y1="300.0" x2="275.0" y2="300.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
<polygon points="275,300 267,296 267,304" fill="#8a8a8a"/>
<rect x="350.0" y="230.0" width="90.0" height="90.0" fill="none" stroke="#2F5D3A" stroke-width="2"/>
<circle cx="350.0" cy="230.0" r="5.0" fill="none" stroke="#2F5D3A" stroke-width="2"/>
<circle cx="350.0" cy="320.0" r="5.0" fill="none" stroke="#2F5D3A" stroke-width="2"/>
<circle cx="440.0" cy="230.0" r="5.0" fill="none" stroke="#2F5D3A" stroke-width="2"/>
<circle cx="440.0" cy="320.0" r="5.0" fill="none" stroke="#2F5D3A" stroke-width="2"/>
<text x="395.0" y="285.0" font-size="10" fill="#2F5D3A" text-anchor="middle" font-weight="600">100 mm</text>
<text x="395.0" y="486.0" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="700">VESA BRACKET</text>
<text x="395.0" y="506.0" font-size="10.3" fill="#555" text-anchor="middle" font-weight="400">100 x 100 mm</text>
<text x="395.0" y="521.0" font-size="10.3" fill="#555" text-anchor="middle" font-weight="400">M4 x 4</text>
<text x="395.0" y="536.0" font-size="10.3" fill="#555" text-anchor="middle" font-weight="400">monitor bolts to the panel</text>
<line x1="485.0" y1="300.0" x2="515.0" y2="300.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
<polygon points="515,300 507,296 507,304" fill="#8a8a8a"/>
<rect x="580.0" y="160.0" width="110.0" height="280.0" fill="#141414" stroke="#000" stroke-width="1.2"/>
<rect x="588.0" y="170.0" width="94.0" height="250.0" fill="#E9E2D0" stroke="#E9E2D0" stroke-width="0"/>
<rect x="618.0" y="300.0" width="34.0" height="12.0" fill="#3a3a3a" stroke="#3a3a3a" stroke-width="1"/>
<text x="635.0" y="486.0" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="700">27" MONITOR</text>
<text x="635.0" y="506.0" font-size="10.3" fill="#555" text-anchor="middle" font-weight="400">cased, intact, portrait</text>
<text x="635.0" y="521.0" font-size="10.3" fill="#555" text-anchor="middle" font-weight="400">IPS 2560x1440 matte</text>
<text x="635.0" y="536.0" font-size="10.3" fill="#555" text-anchor="middle" font-weight="400">own housing = MR18 enclosure</text>
<line x1="725.0" y1="300.0" x2="755.0" y2="300.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 4"/>
<polygon points="755,300 747,296 747,304" fill="#8a8a8a"/>
<rect x="825.0" y="240.0" width="100.0" height="70.0" fill="#2b4a66" stroke="#16293a" stroke-width="1.2"/>
<text x="875.0" y="280.0" font-size="11" fill="#dbe6f0" text-anchor="middle" font-weight="700">Pi 4</text>
<path d="M 825 275 q -30 -20 -14 -44 q 16 -22 -10 -36" stroke="#2f6b3f" stroke-width="2" fill="none"/>
<text x="875.0" y="486.0" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="700">Pi + CABLING</text>
<text x="875.0" y="506.0" font-size="10.3" fill="#555" text-anchor="middle" font-weight="400">Pi 4 behind the monitor</text>
<text x="875.0" y="521.0" font-size="10.3" fill="#555" text-anchor="middle" font-weight="400">HDMI + 5 V</text>
<text x="875.0" y="536.0" font-size="10.3" fill="#555" text-anchor="middle" font-weight="400">one loop over the hinge</text>
<text x="80.0" y="585.0" font-size="11.5" fill="#2F5D3A" text-anchor="start" font-weight="700">RECESSED (recommended)</text>
<text x="80.0" y="603.0" font-size="11" fill="#333" text-anchor="start" font-weight="400">Monitor sits behind a window cut 0.30" inside its bezel outline. Reads as built-in; needs C1 >= 2.48".</text>
<text x="560.0" y="585.0" font-size="11.5" fill="#8a5f10" text-anchor="start" font-weight="700">PROUD (fallback)</text>
<text x="560.0" y="603.0" font-size="11" fill="#333" text-anchor="start" font-weight="400">Monitor bolts to the face. No window at all — round holes only. Needs almost no C1.</text>
<text x="40.0" y="642.0" font-size="11.5" fill="#2F5D3A" text-anchor="start" font-weight="600">The monitor keeps its own housing, so MR18 (nothing exposed from behind) and the thermal design are both solved by the manufacturer.</text>
</svg>