<text x="90.0" y="700.0" font-size="11.5" fill="#2F5D3A" text-anchor="start" font-weight="600">The original door is bagged, labelled and stored with the machine. Rehanging it returns the cabinet</text>
<text x="90.0" y="718.0" font-size="11.5" fill="#2F5D3A" text-anchor="start" font-weight="600">to exactly as-found — a stronger reversibility story than clamping rails or gripping a frame lip, because a cover door is built to come off. (MR2)</text>
<text x="90.0" y="744.0" font-size="11.5" fill="#B3401A" text-anchor="start" font-weight="600">Confirm on the machine: hinge type and spacing, whether the door lifts off pins or swings, and the latch. The 3230 used two spring latches at the top.</text>
