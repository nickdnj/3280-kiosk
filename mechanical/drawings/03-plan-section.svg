<text x="790.0" y="150.0" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="700">DEPTH BUDGET</text>
<line x1="790.0" y1="156.0" x2="1090.0" y2="156.0" stroke="#8a8a8a" stroke-width="0.8"/>
<text x="790.0" y="176.0" font-size="11" fill="#333" text-anchor="start" font-weight="400">0.125"</text>
<text x="848.0" y="176.0" font-size="11" fill="#555" text-anchor="start" font-weight="400">carrier panel</text>
<text x="790.0" y="195.0" font-size="11" fill="#333" text-anchor="start" font-weight="400">1.85"</text>
<text x="848.0" y="195.0" font-size="11" fill="#555" text-anchor="start" font-weight="400">monitor body behind bezel</text>
<text x="790.0" y="214.0" font-size="11" fill="#333" text-anchor="start" font-weight="400">0.50"</text>
<text x="848.0" y="214.0" font-size="11" fill="#555" text-anchor="start" font-weight="400">clearance to inner panel</text>
<text x="790.0" y="233.0" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="700">2.48"</text>
<text x="848.0" y="233.0" font-size="11" fill="#555" text-anchor="start" font-weight="400">= C1 required</text>
<text x="790.0" y="272.0" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="700">IF C1 COMES IN SHORT</text>
<line x1="790.0" y1="278.0" x2="1090.0" y2="278.0" stroke="#8a8a8a" stroke-width="0.8"/>
<text x="790.0" y="298.0" font-size="10.5" fill="#333" text-anchor="start" font-weight="400">1. Mount the monitor PROUD — nothing</text>
<text x="790.0" y="315.0" font-size="10.5" fill="#333" text-anchor="start" font-weight="400">   intrudes behind the door plane</text>
<text x="790.0" y="332.0" font-size="10.5" fill="#333" text-anchor="start" font-weight="400">2. Thinner monitor (check the hump,</text>
<text x="790.0" y="349.0" font-size="10.5" fill="#333" text-anchor="start" font-weight="400">   not the bezel)</text>
<text x="790.0" y="366.0" font-size="10.5" fill="#333" text-anchor="start" font-weight="400">3. Remove the inner perforated panel</text>
<text x="790.0" y="383.0" font-size="10.5" fill="#333" text-anchor="start" font-weight="400">   if VCF permits, and store it</text>
<text x="40.0" y="894.0" font-size="11.5" fill="#2F5D3A" text-anchor="start" font-weight="600">The proud-mount variant needs almost no clearance at all — which is the strongest practical argument for it if C1 measures tight.</text>
<text x="40.0" y="912.0" font-size="11.5" fill="#B3401A" text-anchor="start" font-weight="600">Verify ~26" of clear approach to the hinge side so a fully open door does not foul a neighbouring exhibit.</text>
</svg>